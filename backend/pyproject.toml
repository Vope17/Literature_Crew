[project]
name = "literature-crew"
version = "0.1.0"
description = "A minimal CrewAI literature review app"
requires-python = ">=3.12,<3.14"
dependencies = [
    "crewai>=1.0,<2",
    "fastapi>=0.115,<1",
    "openai>=2,<3",
    "pymupdf>=1.24,<2",
    "python-dotenv>=1.0,<2",
    "requests>=2.32,<3",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = ["httpx>=0.27,<1", "pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
