services:
  nginx:
    build:
      context: .
      target: proxy
    ports:
      - "127.0.0.1:8000:80"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  app:
    build:
      context: .
      target: runtime
    expose:
      - "8000"
    env_file:
      - path: backend/.env
        required: false
    environment:
      HISTORY_DB_PATH: /app/backend/data/history.sqlite3
      CREWAI_TRACING_ENABLED: "false"
      OTEL_SDK_DISABLED: "true"
    volumes:
      - literature-data:/app/backend/data
      - codex-login:/home/app/.codex
      - claude-login:/home/app/.claude
    init: true
    stop_grace_period: 35m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/config', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  backend-test:
    profiles: ["test"]
    build:
      context: .
      target: backend-test
    environment:
      CREWAI_TRACING_ENABLED: "false"
      OTEL_SDK_DISABLED: "true"

  frontend-test:
    profiles: ["test"]
    build:
      context: .
      target: frontend-test

volumes:
  literature-data:
  codex-login:
  claude-login:
